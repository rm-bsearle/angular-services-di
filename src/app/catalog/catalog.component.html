<div class="container">
  <ul class="products">
    <!-- The async pipe lets angular know it is an observable.
      Angular will unwraps emitted values, and unsubscribes on destroy  -->
    @for (product of products | async; track product.id) {
      <li class="product-item">
        <bot-product-details [product]="product">
          <button class="cta" (click)="addToCart(product)">Buy</button>
        </bot-product-details>
      </li>
    }
  </ul>
</div>
